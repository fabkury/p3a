name: v2

# Checks for the p3a 2.0 branch (tiers T1 and T2 in docs/2.0/TESTING.md).
# Device tests, soaks and manual checks cannot run here.

on:
  push:
    branches: [v2]
  pull_request:
    branches: [v2]

permissions:
  contents: read

concurrency:
  group: v2-${{ github.ref }}
  cancel-in-progress: true

jobs:
  tree:
    name: Tree checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Linter self-test
        run: python3 tools/test_check_tree.py
      - name: Settings generator self-test
        run: python3 tools/test_gen_settings.py
      - name: Page embedder self-test
        run: python3 tools/test_embed_static.py
      - name: Layer rule, forbidden patterns, configuration guard
        run: python3 tools/check_tree.py
      - name: Web page logic (node)
        run: node --test tests/web/test_lib.mjs
      - name: Lab unit tests
        run: |
          python3 -m pip install --quiet pyserial pytest
          python3 -m pytest -q host/p3a-lab/test_lab.py

  host-tests:
    name: Host tests (ASan, UBSan)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Ninja
        run: sudo apt-get update -qq && sudo apt-get install -y -qq ninja-build
      - name: Configure
        run: cmake -S tests/host -B build-host -G Ninja
      - name: Build
        run: cmake --build build-host
      - name: Run
        run: ctest --test-dir build-host --output-on-failure

  firmware:
    name: Firmware build (${{ matrix.config }})
    runs-on: ubuntu-latest
    container: espressif/idf:v5.5.4
    strategy:
      fail-fast: false
      matrix:
        include:
          - config: release
            dir: build
            idf_args: ""
            check_args: ""
          - config: test
            dir: build-test
            idf_args: >-
              -B build-test -DSDKCONFIG=build-test/sdkconfig
              '-DSDKCONFIG_DEFAULTS=sdkconfig.defaults;sdkconfig.test.defaults'
            check_args: "--test-build"
    steps:
      - uses: actions/checkout@v4
      - name: Build
        shell: bash
        run: |
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          . "$IDF_PATH/export.sh"
          # esp_wifi_remote keys its Kconfig fragments on major.minor (AGENTS.md).
          export ESP_IDF_VERSION=5.5
          idf.py ${{ matrix.idf_args }} build
      - name: Build checks (revision guard, image size, test hooks only where meant)
        shell: bash
        run: |
          . "$IDF_PATH/export.sh" >/dev/null
          python tools/check_tree.py --build ${{ matrix.dir }} ${{ matrix.check_args }}
      - name: Configuration still matches what 1.x shipped
        if: matrix.config == 'release'
        run: python3 tools/compare_sdkconfig.py sdkconfig
      - name: Keep the binaries
        uses: actions/upload-artifact@v4
        with:
          name: p3a-${{ matrix.config }}-${{ github.sha }}
          path: |
            ${{ matrix.dir }}/p3a.bin
            ${{ matrix.dir }}/bootloader/bootloader.bin
            ${{ matrix.dir }}/partition_table/partition-table.bin
            ${{ matrix.dir }}/ota_data_initial.bin
            ${{ matrix.dir }}/flash_args
          retention-days: 14
